
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sourav AI Studio</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0b1020;color:white;
  font-family:Arial,sans-serif;padding:18px
}
.container{max-width:520px;margin:auto}
h1{text-align:center;color:#8b9cff}
.card{
  background:#171f35;padding:20px;
  border-radius:18px;margin-top:20px
}
label{display:block;margin-top:20px;font-weight:bold}
input,textarea,select{
  width:100%;padding:14px;margin-top:10px;
  border:1px solid #394765;border-radius:12px;
  background:#0f172a;color:white;font-size:16px
}
textarea{min-height:100px}
button{
  width:100%;padding:16px;margin-top:15px;
  border:0;border-radius:12px;
  background:#536dfe;color:white;
  font-size:17px;font-weight:bold
}
button:disabled{opacity:.5}
img,video{width:100%;margin-top:15px;border-radius:12px}
#status{margin-top:18px;text-align:center;color:#a5b4fc}
.small{color:#aab4ce;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="container">

<h1>🎬 Sourav AI Studio</h1>
<p style="text-align:center">Make Your Photo Talk With AI</p>

<div class="card">

<label>📸 Upload Your Photo</label>
<input type="file" id="photo" accept="image/*">
<img id="preview" hidden>

<label>💬 What Should Your Photo Say?</label>
<textarea id="dialogue"
placeholder="Hello Sumit, kya kar rahe ho?"></textarea>

<label>🌐 Select Language</label>
<select id="language">
<option value="hi-IN">Hindi</option>
<option value="en-US">English</option>
</select>

<label>🎤 Voice Preview</label>
<button onclick="previewVoice()">🔊 Preview Voice</button>

<label>🎵 Upload Voice Audio</label>
<input type="file" id="audio" accept="audio/*">
<p class="small">
Video banane ke liye dialogue ki recorded audio file
upload karein. Preview Voice sirf sunne ke liye hai.
</p>

<audio id="audioPreview" controls hidden
style="width:100%;margin-top:15px"></audio>

<button id="generate" onclick="generateVideo()">
✨ Generate Video
</button>

<p id="status">Photo aur audio upload karein.</p>

<video id="result" controls hidden></video>

<a id="download" hidden download="Sourav-AI-Video.mp4">
<button>⬇️ Download Video</button>
</a>

</div>
<p style="text-align:center;color:#9ca3af">
Made with Sourav AI ❤️
</p>
</div>

<script>
const API =
"https://developer26-neuralyx-wav2lip.hf.space";

const photo = document.getElementById("photo");
const audio = document.getElementById("audio");
const statusText = document.getElementById("status");

photo.addEventListener("change",()=>{
 const file=photo.files[0];
 if(!file)return;
 const img=document.getElementById("preview");
 img.src=URL.createObjectURL(file);
 img.hidden=false;
});

audio.addEventListener("change",()=>{
 const file=audio.files[0];
 if(!file)return;
 const player=document.getElementById("audioPreview");
 player.src=URL.createObjectURL(file);
 player.hidden=false;
});

function previewVoice(){
 const text=document.getElementById("dialogue").value;
 if(!text.trim()){
  alert("Pehle dialogue likho");
  return;
 }
 if(!window.speechSynthesis){
  alert("Voice preview supported nahi hai");
  return;
 }
 speechSynthesis.cancel();
 const speech=new SpeechSynthesisUtterance(text);
 speech.lang=document.getElementById("language").value;
 speechSynthesis.speak(speech);
}

async function generateVideo(){
 const imageFile=photo.files[0];
 const audioFile=audio.files[0];

 if(!imageFile){
  alert("Pehle photo upload karo");
  return;
 }
 if(!audioFile){
  alert("Pehle dialogue ki audio file upload karo");
  return;
 }

 const btn=document.getElementById("generate");
 btn.disabled=true;
 statusText.textContent="AI server se connection ho raha hai...";

 try{
  const form=new FormData();
  form.append("image",imageFile);
  form.append("audio",audioFile);

  statusText.textContent="AI video bana raha hai. Wait karo...";

  const response=await fetch(API+"/generate",{
   method:"POST",
   body:form
  });

  if(!response.ok){
   throw new Error("AI server error: "+response.status);
  }

  const videoBlob=await response.blob();

  if(videoBlob.size===0){
   throw new Error("Video file empty hai");
  }

  const videoURL=URL.createObjectURL(videoBlob);
  const result=document.getElementById("result");
  result.src=videoURL;
  result.hidden=false;

  const download=document.getElementById("download");
  download.href=videoURL;
  download.hidden=false;

  statusText.textContent="🎉 Video successfully ready!";

 }catch(error){
  statusText.textContent=
   "Error: "+error.message+
   ". Server sleeping ya connection unavailable ho sakta hai.";
 }finally{
  btn.disabled=false;
 }
}
</script>
</body>
</html>
